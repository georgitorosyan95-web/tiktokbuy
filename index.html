<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTBuy — Магазин TikTok аккаунтов</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #0f172a; color: #f8fafc; line-height: 1.6; }
        
        header { background: #1e293b; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .logo { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 20px; }
        .logo-icon { width: 20px; height: 20px; }
        
        .hero { text-align: center; padding: 60px 20px; position: relative; overflow: hidden; background: linear-gradient(to bottom, #1e293b, #0f172a); }
        .hero-bg-pattern { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; opacity: 0.15; display: flex; flex-wrap: wrap; justify-content: space-around; padding: 20px; gap: 20px; }
        
        /* Уменьшил размер иконок до 30px */
        .hero-bg-pattern svg { width: 30px; height: 30px; animation: floatLogo 5s ease-in-out infinite; }
        
        @keyframes floatLogo {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }

        .hero > *:not(.hero-bg-pattern) { position: relative; z-index: 1; }
        .hero h1 { font-size: 32px; margin-bottom: 15px; }
        
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; text-align: center; }
        .btn { background: #fe2c55; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; width: 100%; }
    </style>
</head>
<body>

    <header>
        <div class="logo">TTBuy</div>
        <button class="btn" style="width: auto;">Войти</button>
    </header>

    <div class="hero">
        <div class="hero-bg-pattern">
            <!-- Небольшие иконки -->
            <svg viewBox="0 0 24 24" fill="#fe2c55"><path d="M19.589 6.686a4.793 4.793 0 01-3.7-1.542V13.8a6.857 6.857 0 11-6.857-6.857c.328 0 .65.03.964.088v3.655a3.171 3.171 0 102.214 3.028V1h3.643a8.471 8.471 0 003.743 3.128v2.558z"/></svg>
            <svg viewBox="0 0 24 24" fill="#229ed9"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg>
            <svg viewBox="0 0 24 24" fill="#e1306c"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069z"/></svg>
            <svg viewBox="0 0 24 24" fill="#ff0000"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814z"/></svg>
        </div>
        
        <h1>Магазин аккаунтов</h1>
        <p>Лучшие аккаунты для работы.</p>
    </div>

    <div class="container">
        <div class="products-grid">
            <div class="card"><h3>Аккаунт Live</h3><button class="btn">Купить</button></div>
            <div class="card"><h3>Аккаунт 1к+</h3><button class="btn">Купить</button></div>
        </div>
    </div>

</body>
</html>
